name: ci

# Root CI for the combined monorepo (R0-10). The vendored platform/.github and engine/.github
# workflows only ever covered their own subtree; this is the gate that runs the cross-cutting
# bridge, engine-host, money, tenant-isolation, authz, and concurrency suites — including the
# DB-gated suites that `make test` skips — plus secret and dependency scanning and the upstream
# drift check. A green run with the DB suites skipped does NOT qualify.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KILL_SWITCH_PATH: /tmp/markting/KILL_SWITCH # keep the engine kill switch out of engine/workspace

jobs:
  node:
    name: node (typecheck, build, package + cloud tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Build the workspace packages first so their published d.ts exist: consumers (other providers,
      # the cloud app) import @adport/core and @adport/mcp by package name, which resolves to dist/*
      # only after a build. A clean CI checkout has no dist, so typecheck must follow build.
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r typecheck
      - run: pnpm -r --filter './packages/*' run test
      - run: ADPORT_RUN_DATABASE_TESTS=0 pnpm --filter @adport/cloud test

  cloud-db:
    name: cloud DB suites (tenant isolation, authz, concurrency) on a real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Start local Supabase (adport schema with auth.users, roles, pg_cron)
        working-directory: platform
        run: npx --yes supabase@latest start
      - name: Apply migrations forward-only (no destructive reset)
        working-directory: platform
        run: npx --yes supabase@latest migration up --local
      - name: Export Supabase env (DB URL + Auth API URL/keys for the isolation & OAuth suites)
        working-directory: platform
        run: |
          npx --yes supabase@latest status -o env > "$RUNNER_TEMP/sb.env"
          get() { sed -n "s/^$1=\"\(.*\)\"\$/\1/p" "$RUNNER_TEMP/sb.env"; }
          echo "::add-mask::$(get SERVICE_ROLE_KEY)"; echo "::add-mask::$(get SECRET_KEY)"
          echo "SUPABASE_DB_URL=$(get DB_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)" >> "$GITHUB_ENV"
          ANON="$(get ANON_KEY)"; [ -z "$ANON" ] && ANON="$(get PUBLISHABLE_KEY)"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON" >> "$GITHUB_ENV"
          SVC="$(get SERVICE_ROLE_KEY)"; [ -z "$SVC" ] && SVC="$(get SECRET_KEY)"
          echo "SUPABASE_SECRET_KEY=$SVC" >> "$GITHUB_ENV"
      - name: Install + run DB-gated suites
        working-directory: platform
        run: |
          pnpm install --frozen-lockfile
          # Build workspace packages so the cloud app can resolve @adport/core and @adport/mcp by name.
          pnpm -r --filter './packages/*' run build
          ADPORT_RUN_DATABASE_TESTS=1 pnpm --filter @adport/cloud test
      - name: Stop Supabase
        if: always()
        working-directory: platform
        run: npx --yes supabase@latest stop || true

  engine:
    name: engine (ruff, mypy, pytest) + engine-host demo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: engine lint + types + tests (clean workspace; kill switch pinned out of tree)
        working-directory: engine
        run: |
          # Mirror the engine's own CI exactly: install all extras + dev group so optional deps
          # (e.g. slack-bolt) are present and typed — otherwise mypy flags untyped decorators.
          uv sync --frozen --all-extras --dev
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen python -m pytest -q   # clean checkout: no stray engine/workspace/KILL_SWITCH
      - name: engine-host (services/engine-demo) tests
        working-directory: engine
        run: PAID_MEDIA_KILL_SWITCH_PATH="$KILL_SWITCH_PATH" uv run --frozen python -m pytest -q ../services/engine-demo/tests

  infra:
    name: infra script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test infra/scripts/stripe-setup.test.mjs

  drift:
    name: upstream drift check (engine byte-identical to import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-upstream-edits.sh

  security:
    name: dependency + secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: pnpm audit (high+ fails)
        working-directory: platform
        run: pnpm install --frozen-lockfile && pnpm audit --prod --audit-level high
      - name: migration RLS posture (every public table enables RLS)
        working-directory: platform
        run: node --test scripts/test-migration-rls.mjs
      - name: uv pip-audit (engine)
        uses: astral-sh/setup-uv@v5
      - name: python dependency audit
        working-directory: engine
        run: uvx pip-audit -r <(uv export --frozen --no-dev 2>/dev/null) || true # advisory; do not block on transitive upstream
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
